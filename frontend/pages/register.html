<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TRAKO</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/landing.css">
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">

  <!-- Simple Header -->
  <header class="navbar">
    <a href="/pages/index.html" class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="15" rx="3"></rect>
        <circle cx="7" cy="19" r="2"></circle>
        <circle cx="17" cy="19" r="2"></circle>
        <path d="M3 10h18M7 4v6M17 4v6"></path>
      </svg>
      <span>TRAKO</span>
    </a>
    <div>
      <span style="color:var(--text-secondary);font-size:0.9rem;">Already have an account?</span>
      <a href="/pages/login.html" class="btn btn-outline btn-sm" style="margin-left:0.5rem;">Sign In</a>
    </div>
  </header>

  <!-- Register Container -->
  <main style="flex-grow:1;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem;">
    <div class="card card-glass" style="max-width:550px;width:100%;padding:2.5rem;">
      <h2 style="font-size:1.75rem;font-weight:800;margin-bottom:0.5rem;">Create Your Account</h2>
      <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:2rem;">
        Join TRAKO for smarter journeys and intelligent fleet management.
      </p>

      <form id="register-form">
        <!-- Role Selection -->
        <div class="form-group">
          <label class="form-label">I am registering as:</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <label class="card" style="padding:0.75rem;cursor:pointer;display:flex;align-items:center;gap:0.5rem;background:var(--bg-input);">
              <input type="radio" name="role" value="PASSENGER" checked onchange="toggleOperatorFields(false)">
              <span style="font-weight:600;font-size:0.9rem;">Passenger</span>
            </label>
            <label class="card" style="padding:0.75rem;cursor:pointer;display:flex;align-items:center;gap:0.5rem;background:var(--bg-input);">
              <input type="radio" name="role" value="OPERATOR" onchange="toggleOperatorFields(true)">
              <span style="font-weight:600;font-size:0.9rem;">Bus Operator</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Maya Deshmukh" required>
        </div>

        <div class="grid grid-2" style="gap:1rem;">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="maya@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+91 98200 12345" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password (min 6 characters)</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required>
        </div>

        <!-- Operator Extra Fields -->
        <div id="operator-fields" style="display:none;background:var(--bg-secondary);padding:1.25rem;border-radius:var(--radius-md);margin-bottom:1.25rem;border:1px solid var(--border-color);">
          <div class="form-group">
            <label class="form-label">Company / Fleet Name</label>
            <input type="text" id="reg-company" class="form-input" placeholder="e.g. Coastal Star Travels Pvt Ltd">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Operator License Number</label>
            <input type="text" id="reg-license" class="form-input" placeholder="e.g. MH-BUS-OP-9982">
          </div>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:1rem;">
          <span>Complete Registration</span>
        </button>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    function toggleOperatorFields(isOperator) {
      document.getElementById('operator-fields').style.display = isOperator ? 'block' : 'none';
      document.getElementById('reg-company').required = isOperator;
      document.getElementById('reg-license').required = isOperator;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.querySelector('input[name="role"]:checked').value;
      const full_name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const company_name = document.getElementById('reg-company').value.trim() || null;
      const operator_license = document.getElementById('reg-license').value.trim() || null;
      const btn = document.getElementById('reg-btn');

      btn.disabled = true;
      btn.innerHTML = 'Registering...';

      try {
        const tokenData = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            role, full_name, email, phone, password, company_name, operator_license
          })
        });

        setAuthSession(tokenData);
        showToast('Registration successful! Redirecting to your dashboard...', 'success');

        setTimeout(() => {
          if (role === 'OPERATOR') window.location.href = '/pages/operator.html';
          else window.location.href = '/pages/passenger.html';
        }, 800);

      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Complete Registration</span>';
      }
    });
  </script>
</body>
</html>
