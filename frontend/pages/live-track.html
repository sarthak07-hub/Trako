<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Bus Tracker — TRAKO</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Header -->
  <header class="navbar">
    <a href="/pages/index.html" class="brand-logo" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="15" rx="3"></rect>
        <circle cx="7" cy="19" r="2"></circle>
        <circle cx="17" cy="19" r="2"></circle>
        <path d="M3 10h18M7 4v6M17 4v6"></path>
      </svg>
      <span>TRAKO</span>
      <span class="tagline-pill">Live Radar</span>
    </a>

    <div style="display:flex;gap:0.75rem;">
      <a href="/pages/passenger.html" class="btn btn-outline btn-sm">Passenger Portal</a>
      <a href="/pages/nearby-stops.html" class="btn btn-secondary btn-sm">Nearby Stands</a>
    </div>
  </header>

  <!-- Live Tracker Layout -->
  <main style="flex-grow:1;display:flex;flex-direction:column;padding:1.5rem;max-width:1400px;width:100%;margin:0 auto;">
    
    <!-- Telemetry Bar -->
    <div id="tracking-card" class="card card-glass" style="margin-bottom:1.5rem;padding:1.25rem 1.75rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
        <div>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;">
            <span id="status-badge" class="badge badge-live">LIVE</span>
            <h2 id="trip-title" style="font-size:1.35rem;font-weight:800;">Connecting...</h2>
          </div>
          <div style="font-size:0.9rem;color:var(--text-secondary);">
            Route: <strong id="route-name">--</strong> &bull; Driver: <span id="driver-name">--</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:2rem;">
          <div style="text-align:right;">
            <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Current Speed</div>
            <div id="speed-display" style="font-size:1.4rem;font-weight:800;color:var(--success);">-- km/h</div>
          </div>

          <div style="text-align:right;">
            <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Next Stop</div>
            <div id="next-stop-display" style="font-size:1rem;font-weight:700;color:var(--text-primary);">--</div>
          </div>

          <div style="text-align:right;">
            <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Last Update</div>
            <div id="last-ping-display" style="font-size:1rem;font-weight:600;color:#60a5fa;">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive Leaflet Map Viewport -->
    <div id="live-map" class="map-view-container" style="flex-grow:1;min-height:550px;"></div>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/live-tracker.js"></script>
</body>
</html>
